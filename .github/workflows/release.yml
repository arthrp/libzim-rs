name: Release

on:
  push:
    tags:
      - 'LIB__*'
      - 'ZIMINFO__*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve crate from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREFIX="${TAG%%__*}"
          VERSION="${TAG##*__}"
          case "$PREFIX" in
            LIB)     MANIFEST=libzim-rs/Cargo.toml ;;
            ZIMINFO) MANIFEST=ziminfo/Cargo.toml ;;
            *) echo "Unknown tag prefix: $PREFIX"; exit 1 ;;
          esac
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify Cargo.toml version matches tag
        run: |
          M="${{ steps.meta.outputs.manifest }}"
          CARGO_VER=$(grep -m1 '^version' "$M" | sed -E 's/.*"(.*)".*/\1/')
          if [ "$CARGO_VER" != "${{ steps.meta.outputs.version }}" ]; then
            echo "Tag version ${{ steps.meta.outputs.version }} != Cargo.toml $CARGO_VER"
            exit 1
          fi
      - name: Publish to crates.io
        run: cargo publish --manifest-path "${{ steps.meta.outputs.manifest }}" --token "${{ secrets.TOKEN }}"
